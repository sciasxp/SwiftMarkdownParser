name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4
    - name: Verify Xcode and Swift toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: swift build --build-tests
    - name: Run tests
      run: swift test
