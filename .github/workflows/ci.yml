name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4
    - name: Verify Xcode and Swift toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: swift build --build-tests
    - name: Build iOS SwiftUI surface
      run: |
        simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
        swift build --target SwiftMarkdownParser --triple arm64-apple-ios17.0-simulator --sdk "$simulator_sdk"
    - name: Run tests
      run: swift test
